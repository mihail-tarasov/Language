<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="card">
    <button id="addButton">Нажмите меня</button>
    <button id="dynamicButton" class="highlight">После нажатия,появление предложения</button>
    <button id="dynamicButton2" class="highlight">Появление перевода</button>
</div>
<style>
    .highlight {
        display: none; /* Сначала кнопка не видна  */
    }

</style>

<script>
    const sentenceButton = document.getElementById('dynamicButton');
    const translationButton = document.getElementById('dynamicButton2');
    // Обработчик для первой кнопки
    document.getElementById('addButton').addEventListener('click', function() {
        // Получаем вторую кнопку и показываем её
        sentenceButton.classList.toggle('highlight');
    });
    document.getElementById('dynamicButton').addEventListener('click', function() {
        // Получаем вторую кнопку и показываем её
        translationButton.classList.toggle('highlight');
    });
</script>


</body>
</html>
