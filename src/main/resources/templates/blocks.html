<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div>
    <!-- Блок 1: слово -->
    <button id="myBtn" class="word-block" onclick="toggleBlock(this, 'sentence')">
        <span class="word">hello</span>
    </button>
    <button id="myBtn2" class="word-block2" onclick="toggleBlock(this, 'sentence')">
        <span class="word">hello</span>
    </button>
    <!-- Блок 2: предложение (скрыт) -->
    <div  class="sentence-block hidden">
        <p class="sentence"></p>
    </div>

    <!-- Блок 3: перевод (скрыт) -->
    <div class="translation-block hidden">
        <p class="word-translation">привет</p>
        <p class="sentence-translation">Привет, как дела?</p>
    </div>

    <script>
        document.getElementById("myBtn").onclick = displayDate;

        function displayDate() {
          document.getElementById("myBtn2");
        }
    </script>
    <details>
        <summary>hello</summary>
        <details>
            <summary>Hello, how are you?</summary>
            <p>привет</p>
            <p>Привет, как дела?</p>
        </details>
    </details>
</div>
</body>
</html>
