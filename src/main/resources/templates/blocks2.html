<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div onmousedown="mDown(this)" onmouseup="mUp(this)"
     style="background-color:#D94A38;width:90px;height:20px;padding:40px;">
    Hello</div>

<script>
    function mDown(obj) {
      obj.style.backgroundColor = "#1ec5e5";
      obj.innerHTML = "Hello,how are you?";
    }

    function mUp(obj) {
      obj.style.backgroundColor="#D94A38";
      obj.innerHTML="Привет, как дела?";
    }
</script>

</body>
</html>
