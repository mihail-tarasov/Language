
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title> Блог сайта </title>

</head>
<body>
   <div class="container mt-5 mb-5">
       <h1>Добавление статьи </h1>
       <form method="post" th:action="@{/home/blog/add}" th:object="${post}">
           <div class="form-container">
                <input type="text" name="word" class="input-field" placeholder="Введите слова" >
           </div>
           <div class="form-container">
                <input type="text" name="translation" class="input-field" placeholder="Введите слова с переводом" class="form-control">
           </div>
           <div class="form-container">
                <textarea name="full_text" class="input-field" placeholder="Введите текст" class="form-control"></textarea>
           </div>
           <button type="submit" class="btn btn-success">Добавить статью</button><br>
       </form>
   </div>




<footer th:insert="blocks/footer :: footer"></footer>
   <style>
       body {
            font-family: Montserrat, cursive;
            background-color: #f9f9f9;
            color: #333;
        }
       .form-container {
            border: 1px solid #eee;
            border-radius: 6px;
            margin: 100px 150px 100px 80px;
            background-color: white;
            padding: 20px;
       }
       .input-field {
         padding: 10px;
         border: 2px solid #6c5ce7;
         border-radius: 8px;
         margin : auto;
       }
       .btn {
          padding: 0.4rem 1.2rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            background-color: #3498db;
            color: white;
            transition: opacity 0.2s;
       }


   </style>
</body>
</html>
