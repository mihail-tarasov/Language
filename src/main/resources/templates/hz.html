<!DOCTYPE html>
<html>
<head>
  <style>
    .card {
      border: 2px solid #6c5ce7;
      border-radius: 15px;
      padding: 40px;
      max-width: 400px;
      margin: 50px auto;
      text-align: center;
      font-family: Arial, sans-serif;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .hidden {
      display: none;
    }
    .word {
      font-size: 28px;
      font-weight: bold;
      color: #333;
    }
    .translation {
      font-size: 22px;
      color: #6c5ce7;
      margin-top: 15px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: #6c5ce7;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="word">hello</div>
  <div class="translation hidden" id="translation">привет</div>
  <button onclick="toggleDisplay()">Показать перевод?</button>
</div>

<script>
  function toggleDisplay() {
    let t = document.getElementById("translation");
    t.classList.toggle("hidden");
  }
</script>

</body>
</html>
